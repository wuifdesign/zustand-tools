version: 2

# Only security updates: `open-pull-requests-limit: 0` disables version updates, while security
# updates (enabled under Settings > Code security > Dependabot security updates) still open PRs.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  # security fixes for the SHA-pinned actions in the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
