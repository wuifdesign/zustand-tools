name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # reused by the release workflow, so a release runs exactly the same checks
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (node ${{ matrix.node }}, react ${{ matrix.react }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # node: the dev tooling (vitest, jsdom, tsdown) needs node >= 22.22, so 20 can not run the suite
        node: ['22', '24']
        # react: the peer range is ^18 || ^19, the lockfile has 19
        react: [18, 19]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Use react ${{ matrix.react }}
        if: matrix.react != 19
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      # lint does not depend on node or react
      - run: npm run lint
        if: matrix.node == '24' && matrix.react == 19
      - run: npm run build
      # the packed files, `exports` map and the types for node16/bundler/CJS consumers, like they are published
      - run: npm run lint:package
        if: matrix.node == '24' && matrix.react == 19
      # fails when the minified and compressed bundle (without react and zustand) grows over the limit in package.json
      - run: npm run size
        if: matrix.node == '24' && matrix.react == 19
      - run: npm test
        env:
          CI: true
